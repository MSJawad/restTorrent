# Local swarm for the end-to-end test: opentracker plus a Transmission seed,
# and restTorrent downloading from them. Everything stays on a private Docker
# network; nothing is published to the host or the internet. Run it through
# run.sh, which sets WORK, PUID and PGID.
name: resttorrent-e2e

services:
  tracker:
    build: ./tracker

  seeder:
    image: linuxserver/transmission:4.1.3-r0-ls365
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: Etc/UTC
    volumes:
      - ${WORK}/seed:/data

  client:
    image: node:24.22.1-alpine3.24
    user: "${PUID}:${PGID}"
    working_dir: /app
    volumes:
      - ../..:/app:ro
      - ${WORK}/seed:/data:ro
      - ${WORK}/out:/out
    entrypoint: ["node", "/app/dist/cli.js"]
    profiles: [client]
