openapi: 3.1.0
info:
  title: restTorrent API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Control a restTorrent download server: add .torrent files, follow their
    progress, pause, resume and remove them. Start the server with
    `resttorrent serve`; it listens on http://127.0.0.1:9080 by default.

    The API has no authentication. It refuses cross-origin requests and,
    when bound to a loopback address, requests whose Host header is not
    localhost, so other web pages cannot drive it from your browser.
servers:
  - url: http://127.0.0.1:9080
# No authentication; see the description above.
security: []
paths:
  /api/torrents:
    get:
      summary: List torrents
      operationId: listTorrents
      responses:
        '200':
          description: Every torrent, in the order they were added.
          content:
            application/json:
              schema:
                type: object
                required: [torrents]
                properties:
                  torrents:
                    type: array
                    items: { $ref: '#/components/schemas/TorrentSummary' }
    post:
      summary: Add a torrent
      operationId: addTorrent
      description: |
        Send the raw bytes of a .torrent file as the request body. The torrent
        starts immediately (after checking any data already on disk) unless
        `paused=true`.
      parameters:
        - name: paused
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/x-bittorrent:
            schema: { type: string, format: binary, maxLength: 10485760 }
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 10485760 }
      responses:
        '201':
          description: Added.
          headers:
            Location:
              schema: { type: string, example: /api/torrents/08ada5a7a6183aae1e09d831df6748d566095a10 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Torrent' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
  /api/torrents/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Get one torrent's progress, including per-file progress
      operationId: getTorrent
      responses:
        '200':
          description: The torrent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Torrent' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Remove a torrent
      operationId: removeTorrent
      parameters:
        - name: deleteFiles
          in: query
          description: Also delete the downloaded files (only the files the torrent lists).
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Removed. }
        '404': { $ref: '#/components/responses/Error' }
  /api/torrents/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Pause a torrent
      operationId: pauseTorrent
      responses:
        '200':
          description: Paused (or already paused).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Torrent' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/torrents/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Resume a paused torrent, or retry one in the error state
      operationId: resumeTorrent
      responses:
        '200':
          description: Resumed (or already downloading).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Torrent' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/events:
    get:
      summary: Stream progress as server-sent events
      operationId: streamEvents
      description: |
        Sends a `torrents` event once a second whose data is the same JSON
        object `GET /api/torrents` returns.
      responses:
        '200':
          description: An endless event stream.
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: torrents
                data: {"torrents":[{"id":"08ada5a7...","state":"downloading","progress":0.42}]}
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      description: The torrent's info hash, as 40 hex characters.
      schema: { type: string, pattern: '^[0-9a-fA-F]{40}$' }
  responses:
    Error:
      description: The request failed; `error` says why.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
  schemas:
    TorrentSummary:
      type: object
      required: [id, name, state, error, size, downloaded, progress, pieces, corruptPieces, peers, downloadSpeed, eta, tracker, fileCount, addedAt]
      properties:
        id: { type: string, description: Info hash (hex). }
        name: { type: string }
        state:
          type: string
          enum: [checking, downloading, paused, completed, error]
        error: { type: [string, 'null'], description: Why the torrent is in the error state. }
        size: { type: integer, description: Total bytes. }
        downloaded: { type: integer, description: Bytes in pieces that passed their SHA-1 check. }
        progress: { type: number, minimum: 0, maximum: 1 }
        pieces:
          type: object
          required: [total, have, checked]
          properties:
            total: { type: integer }
            have: { type: integer }
            checked: { type: integer, description: Pieces re-checked on disk so far (while checking). }
        corruptPieces: { type: integer, description: Pieces that failed their hash check and were downloaded again. }
        peers:
          type: object
          required: [connected, known]
          properties:
            connected: { type: integer }
            known: { type: integer, description: Peer addresses learned from trackers. }
        downloadSpeed: { type: integer, description: 'Bytes per second, averaged over the last few seconds.' }
        eta: { type: [integer, 'null'], description: 'Seconds until done, or null when unknown.' }
        tracker:
          type: object
          required: [lastAnnounce, lastError, peersReturned]
          properties:
            lastAnnounce: { type: [string, 'null'], format: date-time }
            lastError: { type: [string, 'null'] }
            peersReturned: { type: integer }
        fileCount: { type: integer }
        addedAt: { type: [string, 'null'], format: date-time }
    Torrent:
      description: A torrent summary plus per-file progress.
      allOf:
        - $ref: '#/components/schemas/TorrentSummary'
        - type: object
          required: [files]
          properties:
            files:
              type: array
              items:
                type: object
                required: [path, size, downloaded]
                properties:
                  path: { type: string, example: Sintel/Sintel.mp4 }
                  size: { type: integer }
                  downloaded: { type: integer }
